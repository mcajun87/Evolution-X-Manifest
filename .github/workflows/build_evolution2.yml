name: Build Evolution‑X for Galaxy Note10 5G (d1x)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑22.04
    permissions:
      contents: write

    steps:
    - name: 1. 最大化释放 Runner 磁盘空间
      uses: easimon/maximize‑build‑space@v10
      with:
        root‑reserve‑mb: 5120
        swap‑size‑mb: 16384
        remove‑dotnet: 'true'
        remove‑android: 'true'
        remove‑haskell: 'true'
        remove‑codeql: 'true'
        remove‑docker‑images: 'true'

    - name: 2. 手动强制清理残余文件 & 打印磁盘状态
      run: |
        set -e
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
        docker system prune -a -f || true
        sudo apt clean
        df -h

    - name: 3. 安装编译依赖（修复 Ubuntu22.04 废弃包）
      run: |
        set -e
        sudo apt‑get update
        sudo apt‑get install -y \
          bc bison build‑essential ccache curl flex g++‑multilib gcc‑multilib git git‑lfs \
          gnupg gperf imagemagick lib32readline‑dev lib32z1‑dev \
          liblz4‑tool libncurses‑dev libsdl1.2‑dev libssl‑dev libxml2 \
          libxml2‑utils lzop pngcrush rsync schedtool squashfs‑tools xsltproc zip zlib1g‑dev \
          openjdk‑17‑jdk python3 python3‑pip

    - name: 4. 安装最新 Repo 工具
      run: |
        set -e
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git‑repo‑downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo install -m 755 ~/bin/repo /usr/local/bin/repo

    - name: 5. 配置 Git 与 SSH 密钥
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        set -e
        git config --global user.name "mcajun87"
        git config --global user.email "your_email@example.com"
        git config --global core.compression 0

        if [ -n "$SSH_PRIVATE_KEY" ]; then
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh‑keyscan github.com | tee ~/.ssh/known_hosts
        fi

    - name: 6. 初始化源码 + Local Manifest
      run: |
        set -e
        mkdir -p ~/evolution17
        cd ~/evolution17
        repo init -u https://github.com/Evolution‑X/manifest -b cnb --git‑lfs

        mkdir -p .repo/local_manifests
        cat << 'EOF' > .repo/local_manifests/mcajun87_d1x.xml
        <?xml version="1.0" encoding="UTF‑8"?>
        <manifest>
          <remote name="mcajun‑ssh" fetch="git@github.com:mcajun87/" />
          <remote name="github‑https" fetch="https://github.com/" />

          <remove‑project name="platform/packages/apps/Evolver" />
          <project path="packages/apps/Evolver" name="Evolver‑Settings‑App" remote="mcajun‑ssh" revision="main" />

          <project path="device/samsung/d1x" name="android_device_samsung_d1x" remote="mcajun‑ssh" revision="cnb" />
          <project path="device/samsung/exynos9820‑common" name="android_device_samsung_exynos9820‑common" remote="mcajun‑ssh" revision="cnb" />

          <project path="vendor/samsung/d1x" name="proprietary_vendor_samsung_d1x" remote="mcajun‑ssh" revision="cnb" />
          <project path="vendor/samsung/exynos9820‑common" name="proprietary_vendor_samsung_exynos9820‑common" remote="mcajun‑ssh" revision="cnb" />

          <project path="hardware/samsung/slsi‑linaro/exynos" name="android_hardware_samsung_slsi‑linaro_exynos" remote="mcajun‑ssh" revision="cnb" />

          <project path="kernel/samsung/exynos9820" name="Rocky7842/android_kernel_samsung_exynos9820" remote="github‑https" revision="lineage‑23.2" />

          <project path="external/PhhIms" name="phhusson/platform_external_phhims" remote="github‑https" revision="android‑16.0" />
        </manifest>
        EOF

        repo sync -c -j2 --force‑sync --no‑clone‑bundle --no‑tags --no‑repo‑verify
        echo "==== repo sync完成，磁盘状态 ===="
        df -h

    # ========== 先注释SukiSU，跑通ROM本体，后续再开启 ==========
    # - name: 7. 集成 SukiSU‑Ultra 内核
    #   run: |
    #     set -e
    #     cd ~/evolution17/kernel/samsung/exynos9820
    #     ls -la
    #     curl -v -LSs "https://raw.githubusercontent.com/SukiSU‑Ultra/SukiSU‑Ultra/main/kernel/setup.sh" | bash -s main

    - name: 7. 编译 ROM
      run: |
        set -e
        cd ~/evolution17
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 20G
        source build/envsetup.sh
        lunch evo_d1x‑userdebug
        mka evo -j4

    - name: 8. 上传编译产物
      uses: softprops/action‑gh‑release@v1
      with:
        tag_name: EvolutionX‑d1x‑${{ github.run_id }}
        name: Evolution‑X Android 17 for Galaxy Note10 5G
        draft: true
        files: |
          ~/evolution17/out/target/product/d1x/evolution_d1x‑*.zip
          ~/evolution17/out/target/product/d1x/recovery.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
